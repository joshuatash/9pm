
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms - Online Class</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .class-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            padding: 28px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            transition: 0.3s ease;
        }

        .class-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        }

        .class-icon {
            width: 65px;
            height: 65px;
            background: #e8f0fe;
            color: #1967d2;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            margin: 0 auto 18px;
        }

        .status {
            display: inline-block;
            background: #dcfce7;
            color: #15803d;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        h2 {
            color: #172554;
            font-size: 25px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 22px;
        }

        .time-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 22px;
        }

        .time-box p {
            color: #334155;
            font-size: 16px;
            font-weight: bold;
        }

        .time-label {
            color: #64748b;
            font-size: 12px;
            margin-bottom: 7px;
        }

        .meet-btn {
            display: block;
            width: 100%;
            background: #1967d2;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            transition: 0.3s ease;
        }

        .meet-btn:hover {
            background: #0d47a1;
            transform: scale(1.02);
        }

        .footer {
            margin-top: 22px;
            color: #64748b;
            font-size: 12px;
            line-height: 1.8;
        }

        .footer span {
            margin: 0 4px;
        }

    </style>
</head>

<body>

    <div class="class-card">

        <div class="class-icon">
            📚
        </div>

        <span class="status">● ONLINE CLASS</span>

        <h2>HTML FORMS</h2>

        <p class="subtitle">
            Live Interactive Learning Session
        </p>

        <div class="time-box">
            <div class="time-label">⏰ CLASS SCHEDULE</div>
            <p>9:00 PM - 11:00 PM</p>
        </div>

        <a href="https://meet.google.com/ptc-wqux-jdb"
           target="_blank"
           rel="noopener noreferrer"
           class="meet-btn">
            🎥 Join Google Meet →
        </a>

        <div class="footer">
            <span>💻 Be on time</span>
            <span>📖 Come prepared</span>
            <span>🚀 Keep learning</span>
        </div>

    </div>

</body>
</html>
